name: 'Setup Frontend'
description: 'Setup Node.js environment and install dependencies (caller must run actions/checkout first)'
runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '25'
        cache: 'yarn'
        cache-dependency-path: frontend/yarn.lock
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      shell: bash
      working-directory: frontend
